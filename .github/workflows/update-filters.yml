name: Update filter subscriptions

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-filter-subscriptions
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch, deduplicate and publish lists
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate engine
        run: |
          npm run check
          npm test
      - name: Fetch sources and compile outputs
        run: npm run build
      - name: Commit changed generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/
          if git diff --cached --quiet; then
            echo "No generated changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh generated filter subscriptions [skip ci]"
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Published generated filters."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push attempt $attempt failed; fetching main and retrying."
              sleep "$((attempt * 10))"
              git fetch origin main
              git rebase origin/main
            fi
          done
          echo "Unable to push generated filters after 3 attempts."
          exit 1
